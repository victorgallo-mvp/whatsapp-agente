<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fila de leads</title>
<style>
  /* Mesma paleta do dashboard.html (marca Feeling): verde só em marca, foco e
     ação. A temperatura do lead é estado, não série: sempre com texto junto,
     nunca só cor. */
  :root {
    --cyan:     #04D81A;
    --cyan-dk:  #03A814;
    --cyan-lt:  #EAFBEC;
    --dark:     #1C1C1E;
    --dark2:    #374151;
    --surface:  #F7F8FA;
    --border:   #E4E7EC;
    --text:     #111827;
    --muted:    #6B7280;
    --muted2:   #9CA3AF;
    --white:    #FFFFFF;
    --red:      #DC2626;
    --red-lt:   #FEF2F2;
    --amber:    #B45309;
    --amber-lt: #FFF7ED;
    --blue:     #1D4ED8;
    --blue-lt:  #EFF6FF;
    --quente:    #0A7A1C;  --quente-lt:  #EAFBEC;  --quente-bd: #04D81A;
    --morno:     #B45309;  --morno-lt:   #FFF7ED;  --morno-bd:  #F59E0B;
    --frio:      #1D4ED8;  --frio-lt:    #EFF6FF;  --frio-bd:   #93C5FD;
    --semdados:  #6B7280;  --semdados-lt:#F3F4F6;  --semdados-bd:#D1D5DB;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--surface); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
  }

  header {
    background: var(--dark); color: #fff;
    padding: 0 24px; height: 56px;
    display: flex; align-items: center; gap: 16px;
    flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,.08);
    position: sticky; top: 0; z-index: 20;
  }
  .header-brand { display: flex; flex-direction: column; gap: 1px; line-height: 1; }
  .brand-name { font-size: 17px; font-weight: 900; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
  .brand-name .cc { color: var(--cyan); }
  .brand-sub { font-size: 9px; color: rgba(255,255,255,.38); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 2px; }
  .header-links { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .header-links a {
    color: rgba(255,255,255,.75); text-decoration: none; font-size: 12px; font-weight: 600;
    padding: 5px 10px; border-radius: 7px; border: 1px solid rgba(255,255,255,.14);
  }
  .header-links a:hover { background: rgba(255,255,255,.08); color: #fff; }
  #conn-status { font-size: 10.5px; padding: 3px 10px; border-radius: 999px; font-weight: 600; letter-spacing: .2px; }
  #conn-status.connected    { background: rgba(4,216,26,.15);  color: var(--cyan); border: 1px solid rgba(4,216,26,.3); }
  #conn-status.reconnecting { background: rgba(251,191,36,.15); color: #fbbf24;    border: 1px solid rgba(251,191,36,.3); }
  #conn-status.disconnected { background: rgba(220,38,38,.15);  color: #f87171;    border: 1px solid rgba(220,38,38,.25); }

  main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 18px 24px 40px; }

  /* ─── TOTAIS ─────────────────────────── */
  /* ─── TOOLBAR ────────────────────────── */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input {
    flex: 1; min-width: 200px; max-width: 320px;
    padding: 7px 11px; border: 1px solid var(--border); border-radius: 7px;
    font-size: 13px; outline: none; background: var(--white);
  }
  .toolbar input:focus { border-color: var(--cyan); }
  .chip {
    font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--white); color: var(--muted); cursor: pointer;
  }
  .chip.ativo { background: var(--dark); color: #fff; border-color: var(--dark); }
  .toolbar .hint { font-size: 11.5px; color: var(--muted2); margin-left: auto; }

  /* ─── LISTA ──────────────────────────── */
  .lista { display: flex; flex-direction: column; gap: 8px; }
  .lead {
    background: var(--white); border: 1px solid var(--border); border-radius: 11px;
    padding: 12px 14px; display: grid; gap: 10px 14px;
    grid-template-columns: 92px 1fr auto;
    border-left: 4px solid var(--semdados-bd);
  }
  .lead.quente    { border-left-color: var(--quente-bd); }
  .lead.morno     { border-left-color: var(--morno-bd); }
  .lead.frio      { border-left-color: var(--frio-bd); }
  .lead.aguardando { background: #FFFDF5; }

  .nota { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
  .temp {
    font-size: 10.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
  }
  .temp.quente    { background: var(--quente-lt);   color: var(--quente);   border-color: var(--quente-bd); }
  .temp.morno     { background: var(--morno-lt);    color: var(--morno);    border-color: var(--morno-bd); }
  .temp.frio      { background: var(--frio-lt);     color: var(--frio);     border-color: var(--frio-bd); }
  .temp.sem_dados { background: var(--semdados-lt); color: var(--semdados); border-color: var(--semdados-bd); }
  .score { font-size: 30px; font-weight: 800; line-height: .95; }
  .score small { font-size: 11px; font-weight: 600; color: var(--muted2); }
  .barra { width: 76px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--dark2); border-radius: 2px; }
  .lead.quente .barra i { background: var(--quente-bd); }
  .lead.morno  .barra i { background: var(--morno-bd); }
  .lead.frio   .barra i { background: var(--frio-bd); }

  .quem { min-width: 0; }
  .quem-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  /* A moto é o que o vendedor procura primeiro no cartão, então sai da lista
     de campos e ganha linha própria. */
  .moto { font-size: 13.5px; font-weight: 600; margin-top: 5px; }
  .nome { font-size: 14px; font-weight: 700; }
  .fone { font-size: 12px; color: var(--muted); }
  .tempo { font-size: 11px; color: var(--muted2); }
  .estado {
    font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
    background: var(--amber-lt); color: var(--amber); border: 1px solid #FCD34D;
  }
  .estado.ia { background: var(--cyan-lt); color: var(--cyan-dk); border-color: #A7F3B0; }
  .campos { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 7px; }
  .campo { font-size: 12.5px; }
  .campo b { font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .3px; margin-right: 4px; }
  .campo.neg { color: var(--red); }
  .motivos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .motivo {
    font-size: 11px; padding: 2px 8px; border-radius: 6px;
    background: var(--surface); border: 1px solid var(--border); color: var(--dark2);
  }
  .motivo.alerta { background: var(--red-lt); border-color: #FECACA; color: var(--red); }
  .falta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .falta b { color: var(--amber); font-weight: 700; }
  .obs { font-size: 12px; color: var(--muted); margin-top: 6px; font-style: italic; }

  .acoes { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .acoes a {
    text-decoration: none; font-size: 12px; font-weight: 700; text-align: center;
    padding: 7px 12px; border-radius: 7px; white-space: nowrap;
  }
  .btn-wpp  { background: var(--cyan); color: #fff; }
  .btn-wpp:hover { background: var(--cyan-dk); }
  .btn-conv { background: var(--white); color: var(--dark2); border: 1px solid var(--border); }
  .btn-conv:hover { background: var(--surface); }

  /* ─── FILTROS COMO PILLS ─────────────── */
  /* Eram 8 tiles grandes, que ocupavam meia tela antes do primeiro lead. Como
     os grupos ja aparecem na lista com titulo e contagem, o tile grande
     repetia a informacao duas vezes. Virou uma fileira de pills: mesma
     contagem, mesmo clique pra filtrar, um quinto da altura. */
  /* Relógio de espera: cinza enquanto está dentro do aceitável, vermelho quando
     passa. O limite vem de esperaMaxima no config, por temperatura. */
  .espera {
    font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 5px;
    background: #F3F4F6; color: #6B7280; border: 1px solid #E5E7EB;
  }
  .espera.estourou { background: #FEF2F2; color: #DC2626; border-color: #FECACA; }
  .estado.dono { background: #EEF2FF; color: #4338CA; }
  .estado.dono.eu { background: #DCFCE7; color: #15803D; }
  .btn-assumir, .btn-devolver {
    font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
    padding: 7px 12px; border-radius: 8px; text-align: center;
  }
  .btn-assumir { background: #0F766E; color: #fff; border: none; }
  .btn-assumir:hover { background: #115E59; }
  .btn-devolver { background: #fff; color: #6B7280; border: 1px solid #E5E7EB; }
  .btn-devolver:hover { color: #111827; border-color: #9CA3AF; }

  #eu-sou {
    font-family: inherit; font-size: 11.5px; font-weight: 600;
    background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2);
    border-radius: 7px; padding: 5px 8px; cursor: pointer;
  }
  #eu-sou.vazio { background: rgba(251,191,36,.2); border-color: #fbbf24; color: #fde68a; }
  #eu-sou option { color: #111827; }

  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--white); border: 1px solid var(--border); color: var(--dark2);
    border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .pill:hover { border-color: var(--muted2); }
  .pill.ativo { background: var(--dark); color: #fff; border-color: var(--dark); }
  .pill-n {
    min-width: 20px; text-align: center; font-weight: 800; font-size: 11px;
    padding: 1px 5px; border-radius: 999px; background: var(--surface); color: var(--dark2);
  }
  .pill.ativo .pill-n { background: rgba(255,255,255,.2); color: #fff; }
  .pill.vermelho .pill-n { background: var(--red-lt);    color: var(--red); }
  .pill.ambar    .pill-n { background: var(--amber-lt);  color: var(--amber); }
  .pill.verde    .pill-n { background: var(--quente-lt); color: var(--quente); }
  .pill.azul     .pill-n { background: var(--blue-lt);   color: var(--blue); }
  .pill.ativo.vermelho .pill-n, .pill.ativo.ambar .pill-n,
  .pill.ativo.verde .pill-n, .pill.ativo.azul .pill-n { background: rgba(255,255,255,.2); color: #fff; }

  /* ─── GRUPOS POR PENDENCIA ───────────── */
  /* A ordem dos grupos E a ordem de atendimento. O rotulo e a contagem vem do
     config do cliente (qualificacao.baldes), nao estao fixos aqui. */
  .grupo { margin-bottom: 20px; }
  .grupo-head { display: flex; align-items: baseline; gap: 9px; margin: 0 0 8px 2px; cursor: pointer; user-select: none; }
  .grupo-head:hover .grupo-titulo { text-decoration: underline; text-underline-offset: 3px; }
  .grupo-head .seta { font-size: 9px; opacity: .45; }
  .ver-mais {
    width: 100%; padding: 9px; font-family: inherit;
    background: var(--white); border: 1px dashed var(--border); border-radius: 9px;
    font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer;
  }
  .ver-mais:hover { border-color: var(--muted2); color: var(--dark2); background: var(--surface); }
  .grupo-titulo { font-size: 13px; font-weight: 800; letter-spacing: .3px; text-transform: uppercase; }
  .grupo-sub { font-size: 11.5px; color: var(--muted2); }
  .grupo-n { font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: var(--border); color: var(--dark2); }
  .grupo.vermelho .grupo-titulo { color: var(--red); }      .grupo.vermelho .grupo-n { background: var(--red-lt);   color: var(--red); }
  .grupo.ambar    .grupo-titulo { color: var(--amber); }    .grupo.ambar    .grupo-n { background: var(--amber-lt); color: var(--amber); }
  .grupo.verde    .grupo-titulo { color: var(--quente); }   .grupo.verde    .grupo-n { background: var(--quente-lt);color: var(--quente); }
  .grupo.azul     .grupo-titulo { color: var(--blue); }     .grupo.azul     .grupo-n { background: var(--blue-lt);  color: var(--blue); }
  .grupo.cinza    .grupo-titulo { color: var(--muted); }

  /* O que o vendedor tem que FAZER, dentro do cartao. Vem antes dos campos
     porque e a razao do lead estar nessa fila. */
  .acao-box { margin-top: 8px; padding: 7px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); }
  .acao-box b { display: block; font-size: 10px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .acao-box ul { margin: 0; padding-left: 15px; }
  .acao-box li { font-size: 12.5px; line-height: 1.5; }
  .lead.urgente { border-left-color: var(--red) !important; background: var(--red-lt); }

  .vazio { padding: 40px 12px; text-align: center; color: var(--muted2); font-size: 13px; }
  .aviso {
    background: var(--amber-lt); border: 1px solid #FCD34D; color: var(--amber);
    border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 14px;
  }
  .aviso a { color: inherit; }

  @media (max-width: 768px) {
    header { padding: 0 14px; }
    .header-links a { padding: 5px 8px; font-size: 11px; }
    main { padding: 12px 12px 32px; }
    .toolbar input { max-width: none; font-size: 16px; }
    .toolbar .hint { display: none; }
    .lead { grid-template-columns: 1fr; }
    .nota { flex-direction: row; align-items: center; gap: 10px; }
    .acoes { flex-direction: row; }
    .acoes a { flex: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <span class="brand-name"><span class="cc">F</span>ILA</span>
    <span class="brand-sub">Fila de leads</span>
  </div>
  <div class="header-links">
    <select id="eu-sou" class="vazio" style="display:none" onchange="setEu(this.value)" title="Quem está usando esta tela"></select>
    <a href="/dashboard">Conversas</a>
    <a href="/followup">Follow-up</a>
    <span id="conn-status" class="disconnected">Conectando...</span>
  </div>
</header>

<main>
  <div id="aviso-sem-qualificacao" class="aviso" style="display:none">
    Este agente não tem triagem estruturada configurada, então a fila não tem o que ordenar.
    As conversas continuam no <a href="/dashboard">painel</a>.
  </div>

  <!-- Um bloco por pendencia, montado em runtime a partir de qualificacao.baldes -->
  <div class="pills" id="tiles"></div>

  <div class="toolbar">
    <input type="text" id="busca" placeholder="Buscar por nome, telefone, moto ou cidade...">
    <button class="chip ativo" data-f="todos" onclick="setFiltro('todos')">Todos</button>
    <button class="chip" data-f="aguardando" onclick="setFiltro('aguardando')">Aguardando vendedor</button>
    <button class="chip" data-f="hoje" onclick="setFiltro('hoje')">Hoje</button>
    <span class="hint">Grupos por pendência, na ordem de atendimento. Dentro de cada um, por nota.</span>
  </div>

  <div class="lista" id="lista"><div class="vazio">Carregando...</div></div>
</main>

<script>
  let leads = [];
  let filtro = "todos";
  let CONFIG = { ativa: false, campos: [], valores: {}, baldes: [], followup: [] };
  let AGENTE = "o agente de IA";
  let pollFallback = null;
  // Quem está na tela. Não é login: com um WhatsApp só não há como o sistema
  // saber quem digitou, então a pessoa se identifica. Serve pra dois não
  // pegarem o mesmo lead.
  let EU = localStorage.getItem("euSou") || "";
  let ESPERA = null;

  function setEu(v) {
    EU = v || "";
    try { localStorage.setItem("euSou", EU); } catch {}
    const sel = document.getElementById("eu-sou");
    if (sel) sel.classList.toggle("vazio", !EU);
    render();
  }

  // Minutos desde que a IA entregou, e se já passou do aceitável pra
  // temperatura. Lead quente que espera é lead quente perdido, e o que faz
  // isso não acontecer é a demora ficar visível — não alguém lembrar.
  function espera(l) {
    if (!l.passado_em || l.assumido_por) return null;
    const min = Math.floor((Date.now() - new Date(l.passado_em)) / 60000);
    const teto = ESPERA ? (ESPERA[tempDe(l)] ?? ESPERA.sem_dados) : null;
    return { min, estourou: teto != null && min >= teto };
  }
  function textoEspera(min) {
    if (min < 1) return "agora";
    if (min < 60) return min + " min";
    const h = Math.floor(min / 60);
    return h < 24 ? h + "h" : Math.floor(h / 24) + "d";
  }

  async function assumir(phone, ev) {
    if (ev) ev.preventDefault();
    if (!EU) { alert("Escolha quem você é no topo da tela."); return; }
    try {
      const r = await fetch(`/api/leads/${encodeURIComponent(phone)}/assumir`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ quem: EU }),
      });
      if (r.status === 409) {
        const j = await r.json();
        alert(`Este lead já foi assumido por ${j.por || "outra pessoa"}.`);
      }
      await fetchLeads();
    } catch (e) { console.error(e); }
  }
  async function devolver(phone, ev) {
    if (ev) ev.preventDefault();
    try {
      await fetch(`/api/leads/${encodeURIComponent(phone)}/devolver`, { method: "POST" });
      await fetchLeads();
    } catch (e) { console.error(e); }
  }

  // Colapso e paginação por grupo, mesmo motivo do painel: a 1.000 leads/mês
  // um grupo junta dezenas de cartões, e "Em triagem" e "Sem triagem" são os
  // que menos pedem ação. Fica salvo no navegador porque é preferência de quem
  // usa, não estado do lead.
  const POR_PAGINA = 10;
  let fechados = new Set();
  let abertos = {};   // balde -> quantos mostrar
  try { fechados = new Set(JSON.parse(localStorage.getItem("filaGruposFechados") || "[]")); } catch {}

  function alternarGrupo(key) {
    if (fechados.has(key)) fechados.delete(key); else fechados.add(key);
    try { localStorage.setItem("filaGruposFechados", JSON.stringify([...fechados])); } catch {}
    render();
  }
  function verMais(key) {
    abertos[key] = (abertos[key] || POR_PAGINA) + POR_PAGINA;
    render();
  }

  const ORDEM_TEMP = { quente: 0, morno: 1, frio: 2, sem_dados: 3 };
  const RANK_TEMP = { quente: 0, morno: 1, frio: 2, sem_dados: 3 };
  const ROTULO_TEMP = { quente: "Quente", morno: "Morno", frio: "Frio", sem_dados: "Sem triagem" };
  // Campos que aparecem na linha do lead, nesta ordem. "nome", "cidade" e
  // "observacoes" têm lugar próprio no cartão. O que o cliente não declarou
  // nos rótulos cai no nome da chave.
  // Os fatos que decidem a venda, nesta ordem. Era "todos os campos menos
  // alguns ocultos", o que enchia o cartao com 9 ou 10 itens e escondia o que
  // importa. Troca e entrada saem daqui porque a caixa de acao ja as nomeia.
  const FATOS = ["pagamento", "cnh", "cpf", "renda"];
  const OCULTOS = new Set(["nome", "observacoes", "interesse", "modelo"]);
  // Valores que merecem destaque de alerta pro vendedor.
  const NEGATIVOS = new Set(["restrito", "nao", "pesquisando"]);

  function escHtml(s) {
    return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function timeAgo(iso) {
    if (!iso) return "";
    const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1)  return "agora";
    if (m < 60) return m + " min";
    const h = Math.floor(m / 60);
    if (h < 24) return h + " h";
    const d = Math.floor(h / 24);
    return d === 1 ? "ontem" : d + " dias";
  }
  function ehHoje(iso) {
    if (!iso) return false;
    return new Date(iso).toDateString() === new Date().toDateString();
  }
  function foneWA(phone) {
    const d = String(phone || "").replace(/\D/g, "");
    return d.startsWith("55") ? d : "55" + d;
  }
  function tempDe(l) { return l.temperatura || "sem_dados"; }
  // A pendencia vem decidida do servidor (qualificacao.pendencia no config do
  // cliente). A tela nao recalcula: duas reguas divergentes seria pior que
  // nenhuma, e o vendedor nao saberia em qual acreditar.
  function pendDe(l) { return l.pendencia || { balde: "sem_dados", urgencia: 8, titulo: "Sem triagem", acoes: [] }; }
  function baldeDe(k) { return (CONFIG.baldes || []).find(b => b.key === k) || { key: k, titulo: k, cor: "cinza", sub: "" }; }
  function aguardando(l) { return l.stage === "qualificado" && l.olivia_ativa === false; }

  function setFiltro(f) {
    filtro = (filtro === f && f !== "todos") ? "todos" : f;
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("ativo", c.dataset.f === filtro));
    // Os tiles são remontados por renderTiles(), que já marca o ativo.
    render();
  }

  function cardHtml(l) {
    const temp   = tempDe(l);
    const q      = l.qualificacao || {};
    const campos = q.campos || {};
    const score  = l.score ?? null;
    const nome   = l.nome || campos.nome || l.phone;
    const cidade = campos.cidade ? ` · ${escHtml(campos.cidade)}` : "";
    const esperando = aguardando(l);

    const camposHtml = FATOS
      .filter(k => campos[k])
      .map(k => {
        const rot   = (CONFIG.campos.find(c => c.chave === k) || {}).rotulo || k;
        const bruto = campos[k];
        const neg   = NEGATIVOS.has(bruto);
        return `<span class="campo ${neg ? "neg" : ""}"><b>${escHtml(rot)}</b>${escHtml(CONFIG.valores[bruto] || bruto)}</span>`;
      }).join("");

    // "Falta perguntar" só aparece em quem ainda está em triagem: nos baldes de
    // ação o que fazer já está na caixa de ação, e repetir o que falta ali vira
    // ruído. Os "motivos" da nota saíram do cartão por duplicarem os fatos.
    const emTriagem = ["triagem", "sem_dados"].includes(pendDe(l).balde);
    const faltaHtml = (emTriagem && (q.faltando || []).length)
      ? `<div class="falta"><b>Falta perguntar:</b> ${escHtml(q.faltando.join(", "))}</div>` : "";
    const obsHtml = campos.observacoes
      ? `<div class="obs">${escHtml(campos.observacoes.length > 170 ? campos.observacoes.slice(0, 170) + "…" : campos.observacoes)}</div>` : "";

    // O que fazer com este lead, nas palavras da regua. E a razao de ele estar
    // nesta fila, entao vem antes dos campos.
    const p = pendDe(l);
    const acaoHtml = (p.acoes || []).length
      ? `<div class="acao-box"><b>${escHtml(p.titulo)}</b><ul>${p.acoes.map(a => `<li>${escHtml(a)}</li>`).join("")}</ul></div>`
      : "";

    const esp = espera(l);
    const relogio = esp
      ? `<span class="espera ${esp.estourou ? "estourou" : ""}">${escHtml(textoEspera(esp.min))} esperando</span>` : "";
    const btnAssumir = (l.passado_em && !l.assumido_por)
      ? `<button class="btn-assumir" onclick="assumir('${escHtml(l.phone)}', event)">Assumir</button>` : "";
    const btnDevolver = (l.assumido_por && l.assumido_por === EU)
      ? `<button class="btn-devolver" onclick="devolver('${escHtml(l.phone)}', event)">Devolver</button>` : "";

    const estado = l.assumido_por
      ? `<span class="estado dono ${l.assumido_por === EU ? "eu" : ""}">${escHtml(l.assumido_por)} assumiu</span>`
      : esperando
      ? `<span class="estado">Aguardando vendedor</span>`
      : l.olivia_ativa === false ? `<span class="estado">Com atendente</span>`
      : `<span class="estado ia">${escHtml(AGENTE)} atendendo</span>`;

    return `<div class="lead ${temp} ${esperando ? "aguardando" : ""} ${p.balde === "suporte" ? "urgente" : ""}">
      <div class="nota">
        <div class="score">${score === null ? "–" : score}<small>/100</small></div>
        <span class="temp ${temp}">${ROTULO_TEMP[temp]}</span>
      </div>
      <div class="quem">
        <div class="quem-top">
          <span class="nome">${escHtml(nome)}</span>
          <span class="fone">${escHtml(l.phone)}${cidade}</span>
          <span class="tempo">${timeAgo(l.last_interaction_at)}</span>
          ${estado}
          ${relogio}
        </div>
        ${acaoHtml}
        ${campos.modelo ? `<div class="moto">${escHtml(campos.modelo)}</div>` : ""}
        ${camposHtml ? `<div class="campos">${camposHtml}</div>` : ""}
        ${faltaHtml}
        ${obsHtml}
      </div>
      <div class="acoes">
        <a class="btn-wpp" href="https://wa.me/${foneWA(l.phone)}" target="_blank" rel="noopener">Abrir WhatsApp</a>
        <a class="btn-conv" href="/dashboard?phone=${encodeURIComponent(l.phone)}">Ver conversa</a>
        ${btnAssumir}${btnDevolver}
      </div>
    </div>`;
  }

  function renderTiles() {
    const porBalde = {};
    for (const l of leads) { const b = pendDe(l).balde; porBalde[b] = (porBalde[b] || 0) + 1; }
    const el = document.getElementById("tiles");
    el.innerHTML = (CONFIG.baldes || []).map(b => `
      <button class="pill ${b.cor} ${filtro === b.key ? "ativo" : ""}" onclick="setFiltro('${b.key}')" title="${escHtml(b.sub || "")}">
        <span class="pill-n">${porBalde[b.key] || 0}</span>${escHtml(b.titulo)}
      </button>`).join("");
  }

  function render() {
    const q = document.getElementById("busca").value.toLowerCase().trim();
    renderTiles();

    const chaves = new Set((CONFIG.baldes || []).map(b => b.key));
    let itens = leads.filter(l => {
      if (filtro === "aguardando") return aguardando(l);
      if (filtro === "hoje")       return ehHoje(l.last_interaction_at);
      if (chaves.has(filtro))      return pendDe(l).balde === filtro;
      if (filtro !== "todos")      return tempDe(l) === filtro;
      return true;
    });
    if (q) {
      itens = itens.filter(l => {
        const c = (l.qualificacao || {}).campos || {};
        return [l.nome, l.phone, c.nome, c.modelo, c.cidade, c.moto_troca].some(v => (v || "").toLowerCase().includes(q));
      });
    }
    // Urgencia da pendencia, temperatura, estouro de espera, nota, recencia.
    // Temperatura antes do estouro: um frio parado ha 10h nao deve subir acima
    // de um quente que chegou agora. Dentro da mesma temperatura, quem esperou
    // demais passa na frente de quem tem nota melhor.
    itens.sort((a, b) =>
      (pendDe(a).urgencia - pendDe(b).urgencia) ||
      ((RANK_TEMP[tempDe(a)] ?? 3) - (RANK_TEMP[tempDe(b)] ?? 3)) ||
      ((espera(b)?.estourou ? 1 : 0) - (espera(a)?.estourou ? 1 : 0)) ||
      ((b.score ?? -1) - (a.score ?? -1)) ||
      (new Date(b.last_interaction_at || 0) - new Date(a.last_interaction_at || 0))
    );

    const el = document.getElementById("lista");
    if (!itens.length) { el.innerHTML = `<div class="vazio">Nenhum lead neste filtro.</div>`; return; }

    // Um bloco por pendencia, na ordem do config. Quando o filtro ja e um
    // balde, nao faz sentido repetir o cabecalho do grupo.
    if (chaves.has(filtro)) { el.innerHTML = itens.map(cardHtml).join(""); return; }
    const porBalde = {};
    for (const l of itens) { const k = pendDe(l).balde; (porBalde[k] = porBalde[k] || []).push(l); }
    el.innerHTML = (CONFIG.baldes || []).filter(b => porBalde[b.key]?.length).map(b => {
      const todos  = porBalde[b.key];
      const fechado = fechados.has(b.key);
      const limite = abertos[b.key] || POR_PAGINA;
      const mostra = fechado ? [] : todos.slice(0, limite);
      const resto  = todos.length - mostra.length;
      return `<div class="grupo ${b.cor}">
        <div class="grupo-head" onclick="alternarGrupo('${b.key}')">
          <span class="seta">${fechado ? "&#9654;" : "&#9660;"}</span>
          <span class="grupo-titulo">${escHtml(b.titulo)}</span>
          <span class="grupo-n">${todos.length}</span>
          <span class="grupo-sub">${escHtml(b.sub || "")}</span>
        </div>
        ${fechado ? "" : `<div class="lista">${mostra.map(cardHtml).join("")}
          ${resto > 0 ? `<button class="ver-mais" onclick="event.stopPropagation(); verMais('${b.key}')">Ver mais ${Math.min(resto, POR_PAGINA)} de ${resto}</button>` : ""}
        </div>`}
      </div>`;
    }).join("");
  }

  async function fetchLeads() {
    try {
      const r = await fetch("/api/leads");
      if (!r.ok) return;
      const data = await r.json();
      if (!Array.isArray(data)) return;
      leads = data;
      render();
    } catch (e) { console.error("fetchLeads:", e); }
  }

  function connectSSE() {
    const statusEl = document.getElementById("conn-status");
    statusEl.textContent = "Conectando..."; statusEl.className = "reconnecting";
    const es = new EventSource("/api/stream");
    es.onopen = () => {
      statusEl.textContent = "Tempo real"; statusEl.className = "connected";
      clearInterval(pollFallback); pollFallback = null;
    };
    es.onmessage = (e) => {
      let data; try { data = JSON.parse(e.data); } catch { return; }
      if (data.type === "leads_update") fetchLeads();
      if (data.type === "message") {
        const l = leads.find(x => x.phone === data.phone);
        if (l) { l.last_interaction_at = data.created_at; render(); }
      }
    };
    es.onerror = () => {
      statusEl.textContent = "Reconectando..."; statusEl.className = "reconnecting";
      if (!pollFallback) pollFallback = setInterval(fetchLeads, 5000);
    };
  }

  document.getElementById("busca").addEventListener("input", render);

  (async () => {
    try {
      const [info, cfg] = await Promise.all([fetch("/").then(r => r.json()), fetch("/api/qualificacao").then(r => r.json())]);
      if (info.agent) AGENTE = info.agent;
      ESPERA = cfg.esperaMaxima || null;
      const sel = document.getElementById("eu-sou");
      if (sel && Array.isArray(cfg.vendedores) && cfg.vendedores.length) {
        sel.innerHTML = `<option value="">quem é você?</option>` +
          cfg.vendedores.map(v => `<option value="${v}"${v === EU ? " selected" : ""}>${v}</option>`).join("");
        sel.style.display = "";
        sel.classList.toggle("vazio", !EU);
      }
      if (info.company) {
        document.title = `${info.company} — Fila de leads`;
        document.querySelector(".brand-name").innerHTML = `<span class="cc">${escHtml(info.company[0])}</span>${escHtml(info.company.slice(1).toUpperCase())}`;
      }
      CONFIG = cfg;
      if (!cfg.ativa) document.getElementById("aviso-sem-qualificacao").style.display = "";
    } catch (e) { console.error("config:", e); }
    await fetchLeads();
    connectSSE();
    setInterval(fetchLeads, 15000);
  })();
</script>
</body>
</html>

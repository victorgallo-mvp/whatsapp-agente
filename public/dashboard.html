<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunynk — Painel Olivia</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f0f2f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: #111;
  }

  header {
    background: #1a1a2e;
    color: #fff;
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  #conn-status {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600;
    margin-left: auto; transition: background .3s;
  }
  #conn-status.connected    { background: #166534; color: #dcfce7; }
  #conn-status.reconnecting { background: #92400e; color: #fef3c7; }
  #conn-status.disconnected { background: #7f1d1d; color: #fee2e2; }

  .layout { display: flex; flex: 1; overflow: hidden; }

  /* ─── SIDEBAR ─────────────────────────────────────── */
  .sidebar {
    width: 320px; background: #fff;
    border-right: 1px solid #e5e7eb;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .search-wrap { padding: 12px 14px; border-bottom: 1px solid #e5e7eb; }
  .search-wrap input {
    width: 100%; padding: 8px 12px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 13px; outline: none; background: #f9fafb;
  }
  .search-wrap input:focus { border-color: #6366f1; background: #fff; }
  .lead-list { overflow-y: auto; flex: 1; }

  .lead-item {
    padding: 12px 14px; cursor: pointer; border-bottom: 1px solid #f3f4f6;
    display: flex; flex-direction: column; gap: 3px;
    transition: background .12s; position: relative;
  }
  .lead-item:hover { background: #f5f5f5; }
  .lead-item.active { background: #eef2ff; }
  .lead-item.unread::after {
    content: ""; position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    width: 8px; height: 8px; border-radius: 50%; background: #6366f1;
  }
  .lead-top { display: flex; align-items: center; gap: 8px; }
  .lead-name { font-size: 13.5px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lead-time { font-size: 11px; color: #9ca3af; white-space: nowrap; }
  .lead-preview { font-size: 12px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lead-badges { display: flex; gap: 5px; align-items: center; margin-top: 2px; }
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; font-weight: 600; letter-spacing: .2px; }
  .badge-on  { background: #dcfce7; color: #166534; }
  .badge-off { background: #fee2e2; color: #991b1b; }
  .badge-stage { background: #e0e7ff; color: #3730a3; }
  .empty-state { padding: 40px 20px; text-align: center; color: #9ca3af; font-size: 13px; }

  /* ─── MAIN ───────────────────────────────────────── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 14px; }

  .chat-header {
    background: #fff; border-bottom: 1px solid #e5e7eb;
    padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .chat-info { flex: 1; }
  .chat-name { font-size: 15px; font-weight: 600; }
  .chat-sub  { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .toggle-btn {
    padding: 7px 16px; border-radius: 8px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s;
  }
  .toggle-btn:hover { opacity: .82; }
  .toggle-on  { background: #ef4444; color: #fff; }
  .toggle-off { background: #22c55e; color: #fff; }

  /* ─── MESSAGES ───────────────────────────────────── */
  .messages {
    flex: 1; overflow-y: auto; padding: 16px 20px;
    display: flex; flex-direction: column; gap: 8px; background: #f0f2f5;
  }
  .msg-row { display: flex; flex-direction: column; max-width: 72%; }
  .msg-row.user      { align-self: flex-end; align-items: flex-end; }
  .msg-row.assistant { align-self: flex-start; align-items: flex-start; }
  .msg-row.system    { align-self: center; max-width: 90%; }

  .msg-bubble {
    padding: 8px 12px; border-radius: 12px; font-size: 13.5px;
    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .msg-row.user      .msg-bubble { background: #dcf8c6; border-bottom-right-radius: 4px; }
  .msg-row.assistant .msg-bubble { background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .msg-row.system    .msg-bubble { background: #e0e7ff; color: #3730a3; font-size: 12px; text-align: center; border-radius: 8px; }

  .msg-tag  { font-size: 10px; color: #9ca3af; margin-bottom: 1px; }
  .msg-time { font-size: 10.5px; color: #9ca3af; margin-top: 3px; }

  /* ─── INPUT ──────────────────────────────────────── */
  .input-area {
    background: #fff; border-top: 1px solid #e5e7eb;
    padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
  }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .input-area textarea {
    flex: 1; resize: none; border: 1px solid #d1d5db; border-radius: 8px;
    padding: 9px 12px; font-size: 13.5px; font-family: inherit;
    outline: none; height: 42px; max-height: 120px; overflow-y: auto; line-height: 1.4;
  }
  .input-area textarea:focus { border-color: #6366f1; }
  .send-btn {
    padding: 0 18px; height: 42px; background: #6366f1; color: #fff; border: none;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .send-btn:hover { background: #4f46e5; }
  .send-btn:disabled { background: #c7d2fe; cursor: default; }
  .img-btn {
    padding: 0 14px; height: 42px; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 20px; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .img-btn:hover { background: #e5e7eb; }

  /* Image send row */
  .img-send-row {
    display: none; flex-direction: column; gap: 8px;
    background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px;
  }
  .img-send-row.open { display: flex; }
  .img-send-top { display: flex; align-items: center; gap: 8px; }
  .img-preview-wrap {
    width: 64px; height: 64px; border-radius: 8px; overflow: hidden;
    border: 1px solid #d1d5db; background: #e5e7eb; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;
  }
  .img-preview-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .img-send-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .img-filename { font-size: 12px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .img-caption-input {
    border: 1px solid #d1d5db; border-radius: 6px;
    padding: 6px 8px; font-size: 13px; outline: none; width: 100%; font-family: inherit;
  }
  .img-caption-input:focus { border-color: #6366f1; }
  .img-send-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .img-send-ok { padding: 6px 16px; background: #6366f1; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .img-send-ok:hover { background: #4f46e5; }
  .img-send-ok:disabled { background: #c7d2fe; cursor: default; }
  .img-send-cancel { padding: 6px 12px; background: transparent; border: 1px solid #d1d5db; border-radius: 6px; color: #6b7280; font-size: 13px; cursor: pointer; }
  .img-send-cancel:hover { background: #e5e7eb; }

  /* ─── MODAL ──────────────────────────────────────── */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.45); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 14px; padding: 24px;
    width: 420px; max-width: 95vw; display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,.18);
  }
  .modal-box h3 { font-size: 16px; font-weight: 700; }
  .modal-box p  { font-size: 13px; color: #6b7280; }
  .modal-box textarea {
    width: 100%; height: 88px; resize: vertical; border: 1px solid #d1d5db;
    border-radius: 8px; padding: 9px 12px; font-size: 13px; font-family: inherit; outline: none;
  }
  .modal-box textarea:focus { border-color: #6366f1; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .modal-actions button {
    padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-primary   { background: #22c55e; color: #fff; }
  .btn-primary:hover { background: #16a34a; }
  .btn-secondary { background: #6366f1; color: #fff; }
  .btn-secondary:hover { background: #4f46e5; }
  .btn-cancel    { background: #f3f4f6; color: #374151; }
  .btn-cancel:hover { background: #e5e7eb; }


  /* ─── TOAST ──────────────────────────────────────── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1a1a2e; color: #fff; padding: 9px 20px;
    border-radius: 8px; font-size: 13px; opacity: 0;
    transition: opacity .25s; pointer-events: none; z-index: 9999;
  }
  #toast.show { opacity: 1; }

  /* ─── PENDENTES / ACTION TAGS ────────────────────── */
  .section-header {
    padding: 7px 14px 6px; font-size: 10.5px; font-weight: 700;
    letter-spacing: .6px; text-transform: uppercase; color: #9ca3af;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
    border-bottom: 1px solid #f3f4f6;
    position: sticky; top: 0; background: #fff; z-index: 1;
  }
  .section-header.pendentes { color: #b45309; background: #fffbeb; border-color: #fde68a; }
  .section-header.all-leads { cursor: default; }
  .section-count {
    background: #ef4444; color: #fff; border-radius: 999px;
    font-size: 10px; padding: 1px 6px; font-weight: 700; margin-left: 5px;
  }
  .section-toggle { font-size: 10px; color: #9ca3af; }
  .section-body.collapsed { display: none; }

  .action-tag {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
    display: inline-flex; align-items: center; gap: 3px; white-space: nowrap;
  }
  .action-tag.urgente  { background: #fee2e2; color: #991b1b; }
  .action-tag.proposta { background: #fef3c7; color: #92400e; }
  .action-tag.fechar   { background: #dcfce7; color: #166534; }
  .action-tag.visita   { background: #e0f2fe; color: #0c4a6e; }
  .action-tag.ativo    { background: #f3f4f6; color: #6b7280; }

  /* ─── LEAD SUMMARY PANEL ─────────────────────────── */
  .lead-summary-panel {
    background: #fff; border-bottom: 1px solid #e5e7eb;
    padding: 0 20px; flex-shrink: 0; overflow: hidden;
    max-height: 0; transition: max-height .2s ease;
  }
  .lead-summary-panel.open { max-height: 110px; }
  .lead-summary-inner {
    padding: 10px 0; display: flex; gap: 20px;
    align-items: flex-start; flex-wrap: wrap;
  }
  .summary-field { display: flex; flex-direction: column; gap: 2px; }
  .summary-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: #9ca3af; }
  .summary-value { font-size: 12.5px; color: #111; }
  .summary-text  { font-size: 12px; color: #6b7280; font-style: italic; flex: 1; min-width: 180px; line-height: 1.4; }
  .summary-toggle-btn {
    font-size: 11px; padding: 3px 10px; border-radius: 6px;
    border: 1px solid #e5e7eb; background: #f9fafb; color: #6b7280;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .summary-toggle-btn:hover { background: #e5e7eb; }
</style>
</head>
<body>

<header>
  <h1>Comunynk · Painel Olivia</h1>
  <span id="conn-status" class="disconnected">Conectando...</span>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Buscar por nome ou telefone...">
    </div>
    <div class="lead-list" id="lead-list">
      <div class="empty-state">Carregando leads...</div>
    </div>
  </aside>

  <main class="main">
    <div class="placeholder" id="placeholder">Selecione um lead para ver a conversa</div>

    <div id="chat-panel" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
      <div class="chat-header">
        <div class="chat-info">
          <div class="chat-name" id="chat-name">—</div>
          <div class="chat-sub"  id="chat-sub">—</div>
        </div>
        <button class="toggle-btn" id="toggle-btn" onclick="clickToggle()">—</button>
        <button class="summary-toggle-btn" id="summary-toggle-btn" onclick="toggleSummary()" style="display:none">Resumo ▼</button>
      </div>

      <!-- Lead summary strip -->
      <div class="lead-summary-panel" id="summary-panel"></div>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <!-- Image upload row (hidden by default) -->
        <input type="file" id="img-file-input" accept="image/*" style="display:none" onchange="onFileSelected(event)">
        <div class="img-send-row" id="img-send-row">
          <div class="img-send-top">
            <div class="img-preview-wrap" id="img-preview-wrap" onclick="document.getElementById('img-file-input').click()" title="Trocar imagem">
              📷
            </div>
            <div class="img-send-fields">
              <span class="img-filename" id="img-filename">Nenhum arquivo selecionado</span>
              <input type="text" class="img-caption-input" id="img-caption-input" placeholder="Legenda (opcional)">
            </div>
          </div>
          <div class="img-send-actions">
            <button class="img-send-cancel" onclick="toggleImgRow(false)">Cancelar</button>
            <button class="img-send-ok" id="img-send-ok" onclick="sendImage()" disabled>Enviar</button>
          </div>
        </div>
        <!-- Text input row -->
        <div class="input-row">
          <button class="img-btn" onclick="openImgPicker()" title="Enviar imagem">🖼</button>
          <textarea id="msg-input"
            placeholder="Mensagem manual (registrada como assistente)..."
            onkeydown="handleKey(event)"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMsg()">Enviar</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal de reativação -->
<div class="modal-backdrop" id="activate-modal">
  <div class="modal-box">
    <h3>Ativar Olivia</h3>
    <p>Deseja enviar uma mensagem de retorno para o cliente?</p>
    <textarea id="activate-msg"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel"    onclick="closeModal()">Cancelar</button>
      <button class="btn-secondary" onclick="confirmActivate(false)">Ativar sem mensagem</button>
      <button class="btn-primary"   onclick="confirmActivate(true)">Ativar e enviar</button>
    </div>
  </div>
</div>


<div id="toast"></div>

<script>
  let leads              = [];
  let activePhone        = null;
  let oliviaAtiva        = true;
  let msgsCache          = [];
  let unreadPhones       = new Set();
  let pollFallback       = null;
  let pendentesCollapsed = false;
  let summaryOpen        = false;

  // ─── UTILS ─────────────────────────────────────────────────────────
  function timeAgo(iso) {
    if (!iso) return "";
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1)  return "agora";
    if (m < 60) return m + "m";
    const h = Math.floor(m / 60);
    if (h < 24) return h + "h";
    return Math.floor(h / 24) + "d";
  }

  function fmtTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) +
           " · " + d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  }

  function toast(msg, ms = 2500) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), ms);
  }

  function escHtml(s) {
    return (s || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function previewMsg(content, role) {
    if (!content) return "";
    const isImg = content.includes("[o cliente enviou uma imagem") || content.includes("[RELAY:ARTE]");
    if (isImg) return (role === "user" ? "" : "Olivia: ") + "🖼 Imagem";
    const prefix = role === "user" ? "" : "Olivia: ";
    const clean  = content.replace(/\[.*?\]/g, "").replace(/\|.*$/g, "").trim();
    return prefix + (clean.length > 55 ? clean.slice(0, 55) + "…" : clean);
  }

  // Determina tag de remetente
  function msgTag(content, role) {
    if (role !== "assistant") return "";
    const m = content.match(/^\[([A-Z_:]+)\]/);
    if (!m) return "";
    const tag = m[1];
    if (tag === "DIRETO")          return "Operador (WhatsApp)";
    if (tag === "RELAY:MENSAGEM")  return "Operador (dashboard)";
    if (tag === "RELAY:ARTE")      return "Operador (imagem)";
    if (tag === "RELAY:DOCUMENTO") return "Operador (documento)";
    return "";
  }

  // Renderiza uma bolha de mensagem
  function renderBubble(m) {
    const rowClass = m.role === "user" ? "user" : m.role === "assistant" ? "assistant" : "system";
    const tag      = msgTag(m.content, m.role);

    let clean = m.content
      .replace(/^\[[^\]]+\]\s*/, "")
      .replace(/\[o cliente enviou uma imagem[^\]]*\]/g, "📷 Imagem recebida — ver no WhatsApp")
      .replace(/\[RELAY:ARTE\][^\n]*/g, "📷 Imagem enviada — ver no WhatsApp")
      .trim();

    return `<div class="msg-row ${rowClass}">${tag ? `<div class="msg-tag">${escHtml(tag)}</div>` : ""}<div class="msg-bubble">${escHtml(clean)}</div><div class="msg-time">${fmtTime(m.created_at)}</div></div>`;
  }

  // ─── IMAGE UPLOAD ───────────────────────────────────────────────────
  let selectedFileBase64 = null;
  let selectedFileMime   = null;

  function openImgPicker() {
    document.getElementById("img-file-input").click();
  }

  function toggleImgRow(open) {
    document.getElementById("img-send-row").classList.toggle("open", open);
    if (!open) {
      selectedFileBase64 = null;
      selectedFileMime   = null;
      document.getElementById("img-preview-wrap").innerHTML = "📷";
      document.getElementById("img-filename").textContent   = "Nenhum arquivo selecionado";
      document.getElementById("img-caption-input").value    = "";
      document.getElementById("img-send-ok").disabled       = true;
      document.getElementById("img-file-input").value       = "";
    }
  }

  function onFileSelected(e) {
    const file = e.target.files[0];
    if (!file) return;

    if (file.size > 10 * 1024 * 1024) {
      toast("Arquivo muito grande (máx 10 MB)");
      return;
    }

    selectedFileMime = file.type || "image/jpeg";
    document.getElementById("img-filename").textContent = file.name;
    document.getElementById("img-send-row").classList.add("open");

    const reader = new FileReader();
    reader.onload = (ev) => {
      // ev.result = "data:image/jpeg;base64,XXXX..."
      const dataUri = ev.target.result;
      selectedFileBase64 = dataUri.split(",")[1]; // raw base64 sem prefixo

      // Preview
      const wrap = document.getElementById("img-preview-wrap");
      wrap.innerHTML = `<img src="${dataUri}" alt="preview">`;
      document.getElementById("img-send-ok").disabled = false;
    };
    reader.readAsDataURL(file);
  }

  // ─── LEADS ─────────────────────────────────────────────────────────
  async function fetchLeads() {
    try {
      const r = await fetch("/api/leads");
      if (!r.ok) return;
      const data = await r.json();
      if (!Array.isArray(data)) return;
      leads = data;
      renderLeads();
    } catch (e) {
      console.error("fetchLeads:", e);
    }
  }

  function classifyLead(lead) {
    if (lead.olivia_ativa === false) return { key: "urgente",  icon: "⚠️", label: "Atendimento urgente", pendente: true };
    if (lead.stage === "fechando")   return { key: "fechar",   icon: "✅", label: "Fechar negócio",      pendente: true };
    if (lead.stage === "qualificado")return { key: "proposta", icon: "📋", label: "Enviar proposta",     pendente: true };
    if (lead.stage === "qualificando")return { key: "visita",  icon: "📅", label: "Visita agendada",     pendente: true };
    return { key: "ativo", icon: "💬", label: "Em atendimento", pendente: false };
  }

  function leadItemHtml(l) {
    const cls = classifyLead(l);
    return `<div class="lead-item ${l.phone === activePhone ? "active" : ""} ${unreadPhones.has(l.phone) && l.phone !== activePhone ? "unread" : ""}" onclick="selectLead('${escHtml(l.phone)}')"><div class="lead-top"><span class="lead-name">${escHtml(l.nome || l.phone)}</span><span class="lead-time">${timeAgo(l.last_interaction_at)}</span></div><div class="lead-preview">${escHtml(previewMsg(l.ultima_mensagem, l.ultima_role))}</div><div class="lead-badges"><span class="action-tag ${cls.key}">${cls.icon} ${escHtml(cls.label)}</span>${l.empresa ? `<span class="badge badge-stage" style="max-width:90px;overflow:hidden;text-overflow:ellipsis">${escHtml(l.empresa)}</span>` : ""}</div></div>`;
  }

  function togglePendentes() {
    pendentesCollapsed = !pendentesCollapsed;
    renderLeads();
  }

  function renderLeads() {
    const q        = document.getElementById("search").value.toLowerCase();
    const list     = document.getElementById("lead-list");
    const filtered = leads.filter(l =>
      !q ||
      (l.nome    || "").toLowerCase().includes(q) ||
      (l.phone   || "").includes(q) ||
      (l.empresa || "").toLowerCase().includes(q)
    );

    if (!filtered.length) {
      list.innerHTML = '<div class="empty-state">Nenhum lead encontrado.</div>';
      return;
    }

    const pendentes = filtered.filter(l => classifyLead(l).pendente);
    let html = "";

    if (pendentes.length) {
      html += `<div class="section-header pendentes" onclick="togglePendentes()"><span>⚠️ Pendentes<span class="section-count">${pendentes.length}</span></span><span class="section-toggle">${pendentesCollapsed ? "▼" : "▲"}</span></div><div class="section-body ${pendentesCollapsed ? "collapsed" : ""}">${pendentes.map(leadItemHtml).join("")}</div>`;
    }

    html += `<div class="section-header all-leads"><span>Todos os leads</span></div>${filtered.map(leadItemHtml).join("")}`;

    list.innerHTML = html;
  }

  document.getElementById("search").addEventListener("input", renderLeads);

  // ─── LEAD SUMMARY PANEL ─────────────────────────────────────────────
  function updateSummaryPanel(lead) {
    const panel  = document.getElementById("summary-panel");
    const btn    = document.getElementById("summary-toggle-btn");
    const prof   = lead.profile || {};
    const produto    = prof.produto_interesse;
    const orcamento  = prof.orcamento_estimado;
    const resumo     = lead.last_summary;

    if (!produto && !orcamento && !resumo) {
      panel.innerHTML = "";
      panel.classList.remove("open");
      btn.style.display = "none";
      return;
    }

    let fields = "";
    if (produto)   fields += `<div class="summary-field"><span class="summary-label">Produto</span><span class="summary-value">${escHtml(produto)}</span></div>`;
    if (orcamento) fields += `<div class="summary-field"><span class="summary-label">Orçamento est.</span><span class="summary-value">${escHtml(orcamento)}</span></div>`;
    if (resumo)    fields += `<div class="summary-text">${escHtml(resumo)}</div>`;

    panel.innerHTML = `<div class="lead-summary-inner">${fields}</div>`;
    summaryOpen = true;
    panel.classList.add("open");
    btn.style.display = "";
    btn.textContent = "Resumo ▲";
  }

  function toggleSummary() {
    summaryOpen = !summaryOpen;
    const panel = document.getElementById("summary-panel");
    const btn   = document.getElementById("summary-toggle-btn");
    if (summaryOpen) {
      panel.classList.add("open");
      btn.textContent = "Resumo ▲";
    } else {
      panel.classList.remove("open");
      btn.textContent = "Resumo ▼";
    }
  }

  // ─── SELECT LEAD ────────────────────────────────────────────────────
  async function selectLead(phone) {
    activePhone = phone;
    msgsCache   = []; // ← zera cache ao trocar de lead
    unreadPhones.delete(phone);
    renderLeads();

    const lead = leads.find(l => l.phone === phone) || {};
    oliviaAtiva = lead.olivia_ativa !== false;

    document.getElementById("placeholder").style.display = "none";
    const panel = document.getElementById("chat-panel");
    panel.style.display = "flex";

    document.getElementById("chat-name").textContent = lead.nome || phone;
    document.getElementById("chat-sub").textContent  =
      [lead.empresa, phone].filter(Boolean).join(" · ");

    updateToggleBtn();
    updateSummaryPanel(lead);
    toggleImgRow(false);
    await loadMsgs();
  }

  function updateToggleBtn() {
    const btn = document.getElementById("toggle-btn");
    if (oliviaAtiva) {
      btn.textContent = "Desativar Olivia";
      btn.className   = "toggle-btn toggle-on";
    } else {
      btn.textContent = "Ativar Olivia";
      btn.className   = "toggle-btn toggle-off";
    }
  }

  // ─── MESSAGES ───────────────────────────────────────────────────────
  async function loadMsgs(silent = false) {
    if (!activePhone) return;
    try {
      const r = await fetch(`/api/leads/${activePhone}/msgs`);
      if (!r.ok) { console.error("loadMsgs HTTP", r.status); return; }
      const msgs = await r.json();
      if (!Array.isArray(msgs)) { console.error("loadMsgs: resposta nao e array", msgs); return; }

      // Compara por tamanho e timestamp da última mensagem
      const last     = msgs.length > 0 ? msgs[msgs.length - 1] : null;
      const lastCache = msgsCache.length > 0 ? msgsCache[msgsCache.length - 1] : null;
      const changed  = msgs.length !== msgsCache.length ||
                       JSON.stringify(last) !== JSON.stringify(lastCache);
      if (!changed) return;
      msgsCache = msgs;

      const box      = document.getElementById("messages");
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;

      box.innerHTML = msgs.map(renderBubble).join("");

      if (atBottom || !silent) box.scrollTop = box.scrollHeight;
    } catch (e) {
      console.error("loadMsgs:", e);
    }
  }

  // ─── SSE ────────────────────────────────────────────────────────────
  function connectSSE() {
    const statusEl = document.getElementById("conn-status");
    statusEl.textContent = "Conectando...";
    statusEl.className   = "reconnecting";

    const es = new EventSource("/api/stream");

    es.onopen = () => {
      statusEl.textContent = "Tempo real";
      statusEl.className   = "connected";
      clearInterval(pollFallback);
      pollFallback = null;
    };

    es.onmessage = async (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }
      if (data.type === "connected") return;

      if (data.type === "message") {
        if (data.phone === activePhone) {
          await loadMsgs(true);
        } else {
          unreadPhones.add(data.phone);
        }
        const lead = leads.find(l => l.phone === data.phone);
        if (lead) {
          lead.ultima_mensagem     = data.content;
          lead.ultima_role         = data.role;
          lead.last_interaction_at = data.created_at;
          leads.sort((a, b) =>
            new Date(b.last_interaction_at || 0) - new Date(a.last_interaction_at || 0)
          );
        }
        renderLeads();
      }

      if (data.type === "leads_update") {
        await fetchLeads();
        if (data.phone === activePhone && data.olivia_ativa !== undefined) {
          oliviaAtiva = data.olivia_ativa;
          updateToggleBtn();
        }
      }
    };

    es.onerror = () => {
      statusEl.textContent = "Reconectando...";
      statusEl.className   = "reconnecting";
      if (!pollFallback) {
        pollFallback = setInterval(() => { fetchLeads(); loadMsgs(true); }, 5000);
      }
    };
  }

  // ─── TOGGLE ─────────────────────────────────────────────────────────
  function clickToggle() {
    if (!activePhone) return;
    if (oliviaAtiva) {
      doToggle(false, null);
    } else {
      const lead = leads.find(l => l.phone === activePhone) || {};
      const nome = lead.nome || "cliente";
      document.getElementById("activate-msg").value =
        `Olá, ${nome}! Dando continuidade ao seu atendimento. Como posso te ajudar?`;
      document.getElementById("activate-modal").classList.add("open");
    }
  }

  function closeModal() {
    document.getElementById("activate-modal").classList.remove("open");
  }

  async function confirmActivate(comMensagem) {
    closeModal();
    const mensagem = comMensagem ? document.getElementById("activate-msg").value.trim() : null;
    await doToggle(true, mensagem);
  }

  async function doToggle(ativa, mensagem) {
    try {
      const body = { ativa };
      if (mensagem) body.mensagem = mensagem;
      const r = await fetch(`/api/leads/${activePhone}/toggle-olivia`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) throw new Error(await r.text());
      oliviaAtiva = ativa;
      updateToggleBtn();
      const lead = leads.find(l => l.phone === activePhone);
      if (lead) lead.olivia_ativa = ativa;
      renderLeads();
      toast(ativa ? "Olivia ativada" : "Olivia desativada");
      if (mensagem) await loadMsgs(true);
    } catch (e) {
      toast("Erro ao alterar Olivia");
      console.error(e);
    }
  }

  // ─── SEND TEXT ──────────────────────────────────────────────────────
  async function sendMsg() {
    const textarea = document.getElementById("msg-input");
    const text     = textarea.value.trim();
    if (!text || !activePhone) return;

    const btn = document.getElementById("send-btn");
    btn.disabled = true;

    try {
      const r = await fetch(`/api/leads/${activePhone}/send`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      if (!r.ok) throw new Error(await r.text());
      textarea.value = "";
      textarea.style.height = "42px";
      toast("Mensagem enviada");
      await loadMsgs();
    } catch (e) {
      toast("Erro ao enviar mensagem");
      console.error(e);
    } finally {
      btn.disabled = false;
    }
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
    const ta = e.target;
    ta.style.height = "42px";
    ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
  }

  // ─── SEND IMAGE ─────────────────────────────────────────────────────
  async function sendImage() {
    if (!selectedFileBase64 || !activePhone) return;

    const caption = document.getElementById("img-caption-input").value.trim();
    const btn     = document.getElementById("img-send-ok");
    btn.disabled  = true;
    btn.textContent = "Enviando...";

    try {
      const r = await fetch(`/api/leads/${activePhone}/send-image`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          imageBase64: selectedFileBase64,
          mimeType:    selectedFileMime,
          caption,
        }),
      });
      if (!r.ok) throw new Error(await r.text());
      toggleImgRow(false);
      toast("Imagem enviada");
      await loadMsgs();
    } catch (e) {
      toast("Erro ao enviar imagem");
      console.error(e);
      btn.disabled = false;
      btn.textContent = "Enviar";
    }
  }

  // Fecha modal ao clicar fora
  document.getElementById("activate-modal").addEventListener("click", function(e) {
    if (e.target === this) closeModal();
  });

  // ─── INIT ───────────────────────────────────────────────────────────
  fetchLeads();
  connectSSE();
  setInterval(() => { fetchLeads(); loadMsgs(true); }, 6000);
</script>
</body>
</html>

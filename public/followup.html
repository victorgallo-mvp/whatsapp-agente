<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Follow-up</title>
<style>
  /* Mesma paleta do dashboard e da fila (marca Feeling): verde só em marca,
     foco e ação. Esta tela é o oposto da fila: nada aqui é para agora, então
     o vermelho não aparece — o que ela precisa comunicar é QUANDO voltar e
     POR QUÊ, não urgência. */
  :root {
    --cyan:#04D81A; --cyan-dk:#03A814; --cyan-lt:#EAFBEC;
    --dark:#1C1C1E; --dark2:#374151; --surface:#F7F8FA; --border:#E4E7EC;
    --text:#111827; --muted:#6B7280; --muted2:#9CA3AF; --white:#FFFFFF;
    --amber:#B45309; --amber-lt:#FFF7ED; --blue:#1D4ED8; --blue-lt:#EFF6FF;
    --quente:#0A7A1C; --quente-lt:#EAFBEC; --quente-bd:#04D81A;
    --morno:#B45309;  --morno-lt:#FFF7ED;  --morno-bd:#F59E0B;
    --frio:#1D4ED8;   --frio-lt:#EFF6FF;   --frio-bd:#93C5FD;
    --semdados:#6B7280; --semdados-lt:#F3F4F6; --semdados-bd:#D1D5DB;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--surface); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: var(--dark); color: #fff; padding: 0 24px; height: 56px;
    display: flex; align-items: center; gap: 16px; flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,.08); position: sticky; top: 0; z-index: 20;
  }
  .header-brand { display: flex; flex-direction: column; gap: 1px; line-height: 1; }
  .brand-name { font-size: 17px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
  .brand-name .cc { color: var(--cyan); }
  .brand-sub { font-size: 9px; color: rgba(255,255,255,.38); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 2px; }
  .header-links { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .header-links a {
    color: rgba(255,255,255,.75); text-decoration: none; font-size: 12px; font-weight: 600;
    padding: 5px 10px; border-radius: 7px; border: 1px solid rgba(255,255,255,.14);
  }
  .header-links a:hover { background: rgba(255,255,255,.08); color: #fff; }
  #conn-status { font-size: 10.5px; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
  #conn-status.connected    { background: rgba(4,216,26,.15);  color: var(--cyan); border: 1px solid rgba(4,216,26,.3); }
  #conn-status.disconnected { background: rgba(220,38,38,.15); color: #f87171;     border: 1px solid rgba(220,38,38,.25); }

  main { flex: 1; padding: 16px 20px 40px; max-width: 1120px; width: 100%; margin: 0 auto; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile {
    background: var(--white); border: 1px solid var(--border); border-left: 4px solid var(--semdados-bd);
    border-radius: 10px; padding: 11px 13px; cursor: pointer; transition: box-shadow .12s;
  }
  .tile:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .tile.ativo { box-shadow: 0 0 0 2px rgba(4,216,26,.3); }
  .tile .n { font-size: 24px; font-weight: 800; line-height: 1; }
  .tile .l { font-size: 12px; font-weight: 700; margin-top: 4px; }
  .tile .s { font-size: 11px; color: var(--muted2); margin-top: 2px; line-height: 1.35; }
  .tile.cnh         { border-left-color: var(--morno-bd); }  .tile.cnh .n         { color: var(--morno); }
  .tile.cpf         { border-left-color: var(--morno-bd); }  .tile.cpf .n         { color: var(--morno); }
  .tile.sem_entrada { border-left-color: var(--frio-bd); }   .tile.sem_entrada .n { color: var(--frio); }
  .tile.sumiu       { border-left-color: var(--semdados-bd); }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar input {
    flex: 1; min-width: 220px; max-width: 320px; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
    background: var(--white); outline: none;
  }
  .toolbar input:focus { border-color: var(--cyan); }
  .chip {
    background: var(--white); border: 1px solid var(--border); color: var(--dark2);
    border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .chip.ativo { background: var(--dark); color: #fff; border-color: var(--dark); }
  .hint { font-size: 11.5px; color: var(--muted2); margin-left: auto; }

  .grupo { margin-bottom: 22px; }
  .grupo-head { display: flex; align-items: baseline; gap: 9px; margin: 0 0 8px 2px; cursor: pointer; user-select: none; }
  .grupo-head:hover .grupo-titulo { text-decoration: underline; text-underline-offset: 3px; }
  .grupo-head .seta { font-size: 9px; opacity: .45; }
  .ver-mais {
    width: 100%; padding: 9px; font-family: inherit;
    background: var(--white); border: 1px dashed var(--border); border-radius: 9px;
    font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer;
  }
  .ver-mais:hover { border-color: var(--muted2); color: var(--dark2); background: var(--surface); }
  .grupo-titulo { font-size: 13px; font-weight: 800; letter-spacing: .3px; text-transform: uppercase; }
  .grupo-n { font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: var(--border); color: var(--dark2); }
  .grupo-sub { font-size: 11.5px; color: var(--muted2); }

  .lista { display: flex; flex-direction: column; gap: 8px; }
  .lead {
    background: var(--white); border: 1px solid var(--border); border-radius: 11px;
    padding: 12px 14px; display: grid; gap: 10px 14px; grid-template-columns: 84px 1fr auto;
    border-left: 4px solid var(--semdados-bd);
  }
  .lead.quente { border-left-color: var(--quente-bd); }
  .lead.morno  { border-left-color: var(--morno-bd); }
  .lead.frio   { border-left-color: var(--frio-bd); }

  .nota { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
  .temp {
    font-size: 10px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
  }
  .temp.quente    { background: var(--quente-lt);   color: var(--quente);   border-color: var(--quente-bd); }
  .temp.morno     { background: var(--morno-lt);    color: var(--morno);    border-color: var(--morno-bd); }
  .temp.frio      { background: var(--frio-lt);     color: var(--frio);     border-color: var(--frio-bd); }
  .temp.sem_dados { background: var(--semdados-lt); color: var(--semdados); border-color: var(--semdados-bd); }
  .score { font-size: 20px; font-weight: 800; line-height: 1; }
  .score small { font-size: 10px; font-weight: 600; color: var(--muted2); }

  .quem { min-width: 0; }
  .quem-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .nome { font-size: 14px; font-weight: 700; }
  .fone { font-size: 12px; color: var(--muted); }
  .parado { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
  .parado.muito { background: var(--amber-lt); border-color: #FCD34D; color: var(--amber); }

  /* O resumo é o conteúdo principal desta tela: é o que diz se vale ligar e o
     que falar. Por isso tem peso de corpo de texto, não de legenda. */
  .resumo { font-size: 13px; line-height: 1.55; margin-top: 7px; color: var(--text); }
  .resumo.vazio-txt { color: var(--muted2); font-style: italic; }
  .campos { display: flex; flex-wrap: wrap; gap: 3px 13px; margin-top: 7px; }
  .campo { font-size: 12px; }
  .campo b { font-weight: 600; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .3px; margin-right: 4px; }
  .quando { font-size: 12px; margin-top: 7px; padding: 6px 10px; border-radius: 8px; background: var(--blue-lt); border: 1px solid #BFDBFE; color: var(--blue); }

  .acoes { display: flex; flex-direction: column; gap: 6px; }
  .acoes a {
    text-decoration: none; font-size: 12px; font-weight: 700; text-align: center;
    padding: 7px 12px; border-radius: 7px; white-space: nowrap;
  }
  .btn-wpp { background: var(--cyan); color: #fff; }
  .btn-wpp:hover { background: var(--cyan-dk); }
  .btn-conv { background: var(--white); color: var(--dark2); border: 1px solid var(--border); }
  .btn-conv:hover { background: var(--surface); }

  .vazio { padding: 40px 12px; text-align: center; color: var(--muted2); font-size: 13px; }
  .aviso {
    background: var(--amber-lt); border: 1px solid #FCD34D; color: var(--amber);
    border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 14px;
  }
  .aviso a { color: inherit; }

  @media (max-width: 768px) {
    header { padding: 0 14px; }
    .header-links a { padding: 5px 8px; font-size: 11px; }
    main { padding: 12px 12px 32px; }
    .tiles { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .toolbar input { max-width: none; font-size: 16px; }
    .hint { display: none; }
    .lead { grid-template-columns: 1fr; }
    .nota { flex-direction: row; align-items: center; gap: 10px; }
    .acoes { flex-direction: row; }
    .acoes a { flex: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <span class="brand-name"><span class="cc">F</span>OLLOW-UP</span>
    <span class="brand-sub">Quem volta depois</span>
  </div>
  <div class="header-links">
    <a href="/dashboard">Conversas</a>
    <a href="/fila">Fila</a>
    <span id="conn-status" class="disconnected">Conectando...</span>
  </div>
</header>

<main>
  <div id="aviso-sem-qualificacao" class="aviso" style="display:none">
    Este agente não tem triagem estruturada configurada, então não há como agrupar follow-up.
    As conversas continuam no <a href="/dashboard">painel</a>.
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="toolbar">
    <input type="text" id="busca" placeholder="Buscar por nome, telefone, moto ou cidade...">
    <button class="chip ativo" data-f="todos" onclick="setFiltro('todos')">Todos</button>
    <button class="chip" data-f="quentes" onclick="setFiltro('quentes')">Nota 50+</button>
    <button class="chip" data-f="parados" onclick="setFiltro('parados')">Parados 7+ dias</button>
    <span class="hint">Agrupado pelo motivo de voltar. Dentro de cada grupo, por nota.</span>
  </div>

  <div id="lista"><div class="vazio">Carregando...</div></div>
</main>

<script>
  // Esta tela é o estoque de lead que não é para agora: quem está tirando CNH,
  // quem vai olhar ano que vem, quem precisa limpar o nome. A fila mostra o que
  // fazer HOJE; aqui é o que não pode ser esquecido.
  //
  // O agrupamento vem decidido do servidor (qualificacao.followup no config do
  // cliente), igual à pendência da fila: uma régua só, no config, nunca uma
  // cópia em JavaScript.
  let leads = [];
  let filtro = "todos";
  let CONFIG = { ativa: false, campos: [], valores: {}, followup: [] };
  let AGENTE = "o agente de IA";

  // Colapso e paginação por grupo. Esta é a tela que mais acumula: lead que
  // "não é agora" entra e não sai até alguém retomar, então a 1.000 leads por
  // mês ela cresce para sempre enquanto a fila se renova.
  const POR_PAGINA = 10;
  let fechados = new Set();
  let abertos = {};
  try { fechados = new Set(JSON.parse(localStorage.getItem("followupGruposFechados") || "[]")); } catch {}

  function alternarGrupo(key) {
    if (fechados.has(key)) fechados.delete(key); else fechados.add(key);
    try { localStorage.setItem("followupGruposFechados", JSON.stringify([...fechados])); } catch {}
    render();
  }
  function verMais(key) {
    abertos[key] = (abertos[key] || POR_PAGINA) + POR_PAGINA;
    render();
  }

  const ROTULO_TEMP = { quente: "Quente", morno: "Morno", frio: "Frio", sem_dados: "Sem triagem" };
  // Campos que valem numa ligação de retomada. Os de crédito ficam de fora: o
  // que importa aqui é lembrar o contexto, não reavaliar o lead.
  const CAMPOS_UTEIS = ["modelo", "cidade", "moto_troca", "valor_entrada", "prestacao"];

  const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const foneWA = p => { const d = String(p || "").replace(/\D/g, ""); return d.startsWith("55") ? d : "55" + d; };
  const tempDe = l => l.temperatura || "sem_dados";
  function diasParado(l) {
    if (!l.last_interaction_at) return null;
    return Math.floor((Date.now() - new Date(l.last_interaction_at)) / 86400000);
  }
  function textoParado(l) {
    const d = diasParado(l);
    if (d === null) return "sem registro";
    if (d === 0) return "falou hoje";
    if (d === 1) return "1 dia sem falar";
    return `${d} dias sem falar`;
  }
  function grupoDe(l) { return l.followup_grupo || "sumiu"; }
  function metaGrupo(k) {
    return (CONFIG.followup || []).find(g => g.key === k) || { key: k, titulo: k, sub: "" };
  }

  function setFiltro(f) {
    filtro = (filtro === f && f !== "todos") ? "todos" : f;
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("ativo", c.dataset.f === filtro));
    render();
  }

  function cardHtml(l) {
    const temp   = tempDe(l);
    const campos = (l.qualificacao || {}).campos || {};
    const score  = l.score ?? null;
    const nome   = l.nome || campos.nome || l.phone;
    const dias   = diasParado(l);

    const camposHtml = CAMPOS_UTEIS
      .filter(k => campos[k])
      .map(k => {
        const rot = (CONFIG.campos.find(c => c.chave === k) || {}).rotulo || k;
        return `<span class="campo"><b>${esc(rot)}</b>${esc(CONFIG.valores[campos[k]] || campos[k])}</span>`;
      }).join("");

    // O resumo é gerado pela IA ao longo da conversa (last_summary). Quando
    // ainda não existe, a tela diz isso em vez de mostrar um espaço vazio.
    const resumo = l.last_summary
      ? `<div class="resumo">${esc(l.last_summary)}</div>`
      : `<div class="resumo vazio-txt">A IA ainda não gerou resumo desta conversa.</div>`;

    const meta = metaGrupo(grupoDe(l));
    const quando = meta.sub ? `<div class="quando">${esc(meta.sub)}</div>` : "";

    return `<div class="lead ${temp}">
      <div class="nota">
        <span class="temp ${temp}">${ROTULO_TEMP[temp] || temp}</span>
        <div class="score">${score === null ? "–" : score}<small>/100</small></div>
      </div>
      <div class="quem">
        <div class="quem-top">
          <span class="nome">${esc(nome)}</span>
          <span class="fone">${esc(l.phone)}${campos.cidade ? " · " + esc(campos.cidade) : ""}</span>
          <span class="parado ${dias !== null && dias >= 7 ? "muito" : ""}">${esc(textoParado(l))}</span>
        </div>
        ${resumo}
        ${camposHtml ? `<div class="campos">${camposHtml}</div>` : ""}
        ${quando}
      </div>
      <div class="acoes">
        <a class="btn-wpp" href="https://wa.me/${foneWA(l.phone)}" target="_blank" rel="noopener">Retomar no WhatsApp</a>
        <a class="btn-conv" href="/dashboard?phone=${encodeURIComponent(l.phone)}">Ver conversa</a>
      </div>
    </div>`;
  }

  // Quem entra aqui é decidido pela régua do config (followupElegivel), não por
  // esta tela: além de quem declarou que não é agora, entra quem estava em
  // triagem e parou de responder há mais de uma semana — o lead que mais se
  // perde, porque ninguém procura quem não declarou nada. Lead em negociação
  // não aparece: ele é trabalho de hoje e está na fila.
  const ehFollowup = l => l.followup_elegivel ?? ((l.pendencia || {}).balde === "followup");

  function renderTiles() {
    const por = {};
    for (const l of leads.filter(ehFollowup)) { const g = grupoDe(l); por[g] = (por[g] || 0) + 1; }
    document.getElementById("tiles").innerHTML = (CONFIG.followup || []).map(g => `
      <div class="tile ${g.key} ${filtro === g.key ? "ativo" : ""}" onclick="setFiltro('${g.key}')">
        <div class="n">${por[g.key] || 0}</div>
        <div class="l">${esc(g.titulo)}</div>
        <div class="s">${esc(g.sub || "")}</div>
      </div>`).join("");
  }

  function render() {
    renderTiles();
    const q = document.getElementById("busca").value.toLowerCase().trim();
    const chaves = new Set((CONFIG.followup || []).map(g => g.key));

    let itens = leads.filter(ehFollowup).filter(l => {
      if (chaves.has(filtro))   return grupoDe(l) === filtro;
      if (filtro === "quentes") return (l.score ?? 0) >= 50;
      if (filtro === "parados") return (diasParado(l) ?? 0) >= 7;
      return true;
    });
    if (q) {
      itens = itens.filter(l => {
        const c = (l.qualificacao || {}).campos || {};
        return [l.nome, l.phone, c.nome, c.modelo, c.cidade, c.moto_troca]
          .some(v => (v || "").toLowerCase().includes(q));
      });
    }

    // Nota primeiro: dentro de "tirando CNH", quem tinha 70 vale mais uma
    // ligação em março que quem tinha 20. Depois, quem está parado há mais
    // tempo, porque é quem está mais perto de esfriar de vez.
    itens.sort((a, b) =>
      ((b.score ?? -1) - (a.score ?? -1)) ||
      ((diasParado(b) ?? 0) - (diasParado(a) ?? 0))
    );

    const el = document.getElementById("lista");
    if (!itens.length) {
      el.innerHTML = `<div class="vazio">Ninguém em follow-up ${filtro === "todos" ? "no momento" : "neste filtro"}.</div>`;
      return;
    }
    if (chaves.has(filtro)) { el.innerHTML = `<div class="lista">${itens.map(cardHtml).join("")}</div>`; return; }

    const por = {};
    for (const l of itens) { const g = grupoDe(l); (por[g] = por[g] || []).push(l); }
    el.innerHTML = (CONFIG.followup || []).filter(g => por[g.key]?.length).map(g => {
      const todos   = por[g.key];
      const fechado = fechados.has(g.key);
      const limite  = abertos[g.key] || POR_PAGINA;
      const mostra  = fechado ? [] : todos.slice(0, limite);
      const resto   = todos.length - mostra.length;
      return `<div class="grupo">
        <div class="grupo-head" onclick="alternarGrupo('${g.key}')">
          <span class="seta">${fechado ? "&#9654;" : "&#9660;"}</span>
          <span class="grupo-titulo">${esc(g.titulo)}</span>
          <span class="grupo-n">${todos.length}</span>
          <span class="grupo-sub">${esc(g.sub || "")}</span>
        </div>
        ${fechado ? "" : `<div class="lista">${mostra.map(cardHtml).join("")}
          ${resto > 0 ? `<button class="ver-mais" onclick="event.stopPropagation(); verMais('${g.key}')">Ver mais ${Math.min(resto, POR_PAGINA)} de ${resto}</button>` : ""}
        </div>`}
      </div>`;
    }).join("");
  }

  async function fetchLeads() {
    try {
      // Limite maior que o padrão de propósito: a tela existe pra achar lead
      // de semanas atrás, que é exatamente o que o default corta primeiro.
      const r = await fetch("/api/leads?limit=1000");
      leads = await r.json();
      render();
    } catch (e) { console.error("fetchLeads:", e); }
  }

  function conectarSSE() {
    const st = document.getElementById("conn-status");
    const es = new EventSource("/api/stream");
    es.onopen = () => { st.className = "connected"; st.textContent = "Ao vivo"; };
    es.onerror = () => { st.className = "disconnected"; st.textContent = "Reconectando..."; };
    es.addEventListener("leads_update", fetchLeads);
  }

  (async () => {
    try {
      const [info, cfg] = await Promise.all([
        fetch("/").then(r => r.json()),
        fetch("/api/qualificacao").then(r => r.json()),
      ]);
      if (info.agent) AGENTE = info.agent;
      if (info.company) {
        document.title = `${info.company} — Follow-up`;
        const b = document.querySelector(".brand-name");
        if (b) b.innerHTML = `<span class="cc">${info.company[0]}</span>${info.company.slice(1).toUpperCase()}`;
      }
      CONFIG = cfg;
      if (!cfg.ativa) {
        document.getElementById("aviso-sem-qualificacao").style.display = "";
        document.getElementById("tiles").style.display = "none";
        document.getElementById("lista").innerHTML = "";
        return;
      }
      document.getElementById("busca").addEventListener("input", render);
      await fetchLeads();
      conectarSSE();
    } catch (e) {
      console.error("init:", e);
      document.getElementById("lista").innerHTML = `<div class="vazio">Erro ao carregar.</div>`;
    }
  })();
</script>
</body>
</html>

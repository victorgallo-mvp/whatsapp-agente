<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground — Teste de Agente</title>
<style>
  :root {
    --bg: #0f1115; --surface: #171a21; --card: #1d2129; --border: #2a2f3a;
    --text: #e8eaed; --muted: #9099a8; --accent: #6ea8ff; --green: #1f7a4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: .3px; }
  header .badge {
    font-size: 11px; color: var(--muted); background: var(--card);
    padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border);
  }
  select, button {
    font-family: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); color: #0f1115; border-color: var(--accent); font-weight: 600; }
  button:hover { filter: brightness(1.1); }
  main { flex: 1; display: flex; overflow: hidden; }
  #chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-direction: column; max-width: 72%; }
  .row.user { align-self: flex-start; align-items: flex-start; }
  .row.assistant { align-self: flex-end; align-items: flex-end; }
  .bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .row.user .bubble { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .row.assistant .bubble { background: var(--green); color: #eafff2; border-bottom-right-radius: 4px; }
  .tags { font-size: 10.5px; color: var(--muted); margin-top: 4px; }
  .tags span { background: #3a2a1a; color: #ffb877; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
  #input-row { display: flex; gap: 8px; padding: 14px 20px; background: var(--surface); border-top: 1px solid var(--border); }
  #msg-input {
    flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 14px; resize: none; font-family: inherit;
  }
  #debug-col {
    width: 320px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--surface);
    overflow-y: auto; padding: 16px;
  }
  #debug-col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 0 0 10px; }
  .debug-entry { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .debug-entry .sim { font-size: 11px; color: var(--accent); font-weight: 700; }
  .debug-entry .ctx { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .empty-hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 40px; }
  .loading { color: var(--muted); font-size: 13px; padding: 4px 14px; }
</style>
</head>
<body>

<header>
  <h1>🧪 Playground</h1>
  <span class="badge">testa qualquer clients/*.js sem WhatsApp — histórico não persiste no banco</span>
  <select id="client-select"></select>
  <button id="reset-btn">Reiniciar conversa</button>
</header>

<main>
  <div id="chat-col">
    <div id="messages"><div class="empty-hint">Escolha um cliente acima e manda "oi" pra começar.</div></div>
    <div id="input-row">
      <textarea id="msg-input" rows="1" placeholder="Digite como se fosse o lead..."></textarea>
      <button class="primary" id="send-btn">Enviar</button>
    </div>
  </div>
  <div id="debug-col">
    <h2>Última busca no conhecimento</h2>
    <div id="debug-content"><span class="empty-hint" style="margin-top:0">Nada ainda.</span></div>
  </div>
</main>

<script>
  let sessionId = localStorage.getItem("playground-session") || crypto.randomUUID();
  localStorage.setItem("playground-session", sessionId);

  const clientSelect = document.getElementById("client-select");
  const messagesEl   = document.getElementById("messages");
  const inputEl      = document.getElementById("msg-input");
  const debugEl      = document.getElementById("debug-content");

  async function carregarClientes() {
    const r = await fetch("/admin/playground/clients");
    const { clients } = await r.json();
    clientSelect.innerHTML = clients.map(c => `<option value="${c}">${c}</option>`).join("");
    const salvo = localStorage.getItem("playground-client");
    if (salvo && clients.includes(salvo)) clientSelect.value = salvo;
  }
  clientSelect.addEventListener("change", () => {
    localStorage.setItem("playground-client", clientSelect.value);
  });

  function addRow(role, text, tags) {
    if (messagesEl.querySelector(".empty-hint")) messagesEl.innerHTML = "";
    const row = document.createElement("div");
    row.className = "row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    if (tags && tags.length) {
      const tagsEl = document.createElement("div");
      tagsEl.className = "tags";
      tagsEl.innerHTML = tags.map(t => `<span>${t}</span>`).join("");
      row.appendChild(tagsEl);
    }
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function renderDebug(knowledgeUsado) {
    if (!knowledgeUsado || !knowledgeUsado.length) {
      debugEl.innerHTML = '<span class="empty-hint" style="margin-top:0">Nenhum conhecimento acima do threshold para essa mensagem.</span>';
      return;
    }
    debugEl.innerHTML = knowledgeUsado.map(k => `
      <div class="debug-entry">
        <div class="sim">sim = ${k.similarity}</div>
        <div class="ctx">[${k.source_type}] ${k.context || "(sem context)"}</div>
      </div>
    `).join("");
  }

  async function enviar() {
    const texto = inputEl.value.trim();
    if (!texto) return;
    const clientSlug = clientSelect.value;
    if (!clientSlug) return;

    addRow("user", texto);
    inputEl.value = "";
    inputEl.style.height = "auto";

    const loadingRow = document.createElement("div");
    loadingRow.className = "loading";
    loadingRow.textContent = "Olivia está digitando...";
    messagesEl.appendChild(loadingRow);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const r = await fetch("/admin/playground/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ clientSlug, sessionId, message: texto }),
      });
      const data = await r.json();
      loadingRow.remove();
      if (data.error) {
        addRow("assistant", "[erro] " + data.error);
        return;
      }
      addRow("assistant", data.reply, data.tagsDetectadas);
      renderDebug(data.knowledgeUsado);
    } catch (e) {
      loadingRow.remove();
      addRow("assistant", "[erro de conexão] " + e.message);
    }
  }

  document.getElementById("send-btn").addEventListener("click", enviar);
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  document.getElementById("reset-btn").addEventListener("click", async () => {
    await fetch("/admin/playground/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId }),
    });
    messagesEl.innerHTML = '<div class="empty-hint">Conversa reiniciada. Manda "oi" pra começar de novo.</div>';
    debugEl.innerHTML = '<span class="empty-hint" style="margin-top:0">Nada ainda.</span>';
  });

  carregarClientes();
</script>

</body>
</html>
